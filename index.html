<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>snowpack</title>
  <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAa0lEQVR4AeyUsQ2AMAwEX16CkhGYACkVKyEmQKxEFYkJGCFlpkhGSBVd85aut87vjwZPCB4vYAORvlMkPgFvIO+PSHgDcBOLN1DvTSS8AWdguX6ROAO8gXIkkfAG3APrm0XiDNjAdAOjN+8AAAD//+p196wAAAAGSURBVAMA7wyf0EFuh2UAAAAASUVORK5CYII=" />
  <link rel="icon" type="image/png" sizes="16x16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAUElEQVR4AaTTMQkAIBRF0YclHI1gAsHJSmICsZLTBxMYwdEUGuI+uOvnLN89OCc4fiCvKhIXWBoiccHtUSQu8G2LxAWnZJG4IEwTiQvgM+oDAAD//8RbRzcAAAAGSURBVAMAzAPP4RPQneYAAAAASUVORK5CYII=" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a3138; font: 13px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif; color: #3a4048; }
    canvas { display: block; }
    #season { position: fixed; top: 12px; left: 14px; appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: #aab3bc; font: inherit; font-size: 12px; letter-spacing: .04em; padding: 2px 4px; cursor: pointer; outline: none; }
    #season:hover { color: #ffffff; }
    #timebar { position: fixed; left: 8vw; right: 8vw; bottom: 26px; height: 28px; cursor: pointer; user-select: none; touch-action: none; opacity: 0; transition: opacity .6s; }
    #timebar.on { opacity: 1; }
    #timebar .track { position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: #4a525a; }
    #timebar .fill { position: absolute; left: 0; top: 13px; height: 2px; background: #aab3bc; width: 0; }
    #timebar .tick { position: absolute; top: 10px; width: 1px; height: 8px; background: #5a626a; }
    #timebar .tick span { position: absolute; top: 12px; left: 0; transform: translateX(-50%); font-size: 10px; color: #8a929b; white-space: nowrap; }
    #timebar .knob { position: absolute; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: #f4f6f8; transform: translateX(-50%); }
    #timebar .date { position: absolute; top: -18px; transform: translateX(-50%); white-space: nowrap; color: #f4f6f8; font-size: 12px; }
    #weak { position: fixed; top: 48px; left: 14px; max-width: 48vw; max-height: calc(100vh - 140px); overflow-y: auto; font-size: 12px; color: #c7ced5; }
    #weak { scrollbar-width: thin; scrollbar-color: #4a525a transparent; }
    #weak .title { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a929b; margin: 0 4px 6px; }
    #weak .item, #weak .head { display: grid; grid-template-columns: 18px 10px 48px 52px 36px 48px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 3px; }
    #weak .rank { color: #8a929b; text-align: right; }
    #weak .head { font-size: 11px; color: #8a929b; padding-bottom: 2px; }
    #weak .item { cursor: crosshair; }
    #weak .item:hover { background: rgba(255,255,255,.08); color: #ffffff; }
    #weak .dot { width: 10px; height: 10px; border-radius: 2px; }
    #weak .h { color: #8a929b; text-align: right; }
    #weak .d { color: #8a929b; }
    #weak .s { text-align: right; font-weight: 600; }
    #obs { position: fixed; left: 14px; bottom: 78px; width: 380px; font-size: 12.5px; line-height: 1.4; color: #c7ced5; opacity: 0; transition: opacity .3s; }
    #obs .chip { display: inline-block; padding: 1px 6px; margin: 1px 0; border-radius: 3px; background: rgba(143,183,224,.18); color: #eef3f8; cursor: crosshair; line-height: 1.25; }
    #obs .chip:hover { background: rgba(143,183,224,.45); color: #fff; }
    #obs.on { opacity: 1; }
    #obs .measured { color: #9aa3ad; font-size: 11.5px; margin-bottom: 6px; }
    #obs .measured b { color: #e6ebef; font-weight: 600; }
    #obs .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a929b; margin-bottom: 3px; }
    #obs .who b { color: #e6ebef; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 12px; margin-left: 8px; }
    #obs .danger { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 8px; font-weight: 600; letter-spacing: 0; text-transform: none; }
    #obs .text { color: #dfe5ea; }
    #obs .problem { color: #9aa3ad; margin-top: 2px; }
    #timebar .obs { position: absolute; top: 12px; width: 4px; height: 4px; border-radius: 50%; background: #8fb7e0; transform: translateX(-50%); }
    #hint { position: fixed; left: 0; right: 0; bottom: 70px; text-align: center; color: #aab3bc; font-size: 12px; pointer-events: none; transition: opacity .6s; }
    .card { position: fixed; right: 16px; width: 330px; pointer-events: none; background: rgba(255,255,255,.94); color: #3a4048; padding: 12px 14px 10px; border-radius: 4px; font-size: 13px; line-height: 1.35; box-shadow: 0 1px 6px rgba(0,0,0,.10); opacity: 0; transition: opacity .15s; }
    #tip { top: 14px; }           /* the snow card */
    #tip2 { top: 480px; }         /* the boundary card: below the tallest snow card (with notes) plus a 100px gap */
    .card.on { opacity: 1; }
    .card.dim { opacity: .4; }
    .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #22262b; height: 1.3em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .kind { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a929b; margin-bottom: 4px; }
    .card table { border-collapse: collapse; width: 100%; }
    .card td { padding: 3px 0; vertical-align: top; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .card td:first-child { color: #8a929b; width: 92px; }
    .card .bond-weak { color: #d63c36; font-weight: 600; } .card .bond-moderate { color: #b8901c; font-weight: 600; } .card .bond-strong { color: #2a9d5c; font-weight: 600; }
    .card .notes { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e6e9ed; color: #5a626b; }

    /* ---- touch devices (body.touch, set in main.js): no hover, so tap to select; one thing open at a time.
       Desktop never gets this class, so none of this applies there. ---- */
    #tbtns { display: none; }
    body.touch #tbtns { display: flex; gap: 6px; position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 8px; }
    #tbtns button { font: inherit; font-size: 13px; color: #c7ced5; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 7px 13px; }
    #tbtns button.on { background: #e6ebef; color: #22262b; border-color: #e6ebef; }
    #tbtns button[hidden] { display: none; }
    body.touch #season { top: calc(14px + env(safe-area-inset-top)); font-size: 13px; }
    body.touch #weak, body.touch #obs { display: none; }
    body.touch #weak.open, body.touch #obs.open { display: block; position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 8px; right: 8px; bottom: auto; width: auto; max-width: none;
      max-height: calc(100% - 170px); overflow-y: auto; opacity: 1; background: rgba(36,42,48,.96); border-radius: 8px; padding: 10px 8px; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
    body.touch #weak .item { padding: 9px 6px; cursor: default; }
    body.touch #weak .item.sel { background: rgba(255,255,255,.12); color: #fff; }
    body.touch #obs .chip { padding: 3px 7px; }
    /* the info card: compact, two columns, along the bottom above the time bar (the scene is shifted up to clear it) */
    body.touch #tip, body.touch #tip2 { top: auto; }
    body.touch .card { left: 8px; right: 8px; width: auto; bottom: calc(80px + env(safe-area-inset-bottom)); max-height: 28vh; overflow-y: auto; pointer-events: auto;
      padding: 7px 10px 6px; font-size: 11.5px; line-height: 1.3; }
    body.touch .card:not(.on) { display: none; }
    body.touch .card .kind { font-size: 10px; margin-bottom: 1px; }
    body.touch .card h3 { font-size: 13px; margin-bottom: 4px; }
    body.touch .card table, body.touch .card tbody { display: block; }
    body.touch .card tbody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
    body.touch .card tr { display: flex; gap: 6px; min-width: 0; }
    body.touch .card td { padding: 1px 0; max-width: none; }
    body.touch .card td:first-child { width: auto; flex: none; }
    body.touch .card td:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    body.touch .card tr[data-k="stability"], body.touch .card tr[data-k="bond strength"], body.touch .card tr[data-k="snow above"] { grid-column: 1 / -1; }
    body.touch .card tr[data-k="shear load"], body.touch .card tr[data-k="above"], body.touch .card tr[data-k="below"],
    body.touch .card tr[data-k="density"] { display: none; }
    body.touch .card .notes { margin-top: 4px; padding-top: 4px; }
    body.touch #timebar { left: 22px; right: 22px; bottom: calc(18px + env(safe-area-inset-bottom)); }
    body.touch #timebar::after { content: ''; position: absolute; left: -16px; right: -16px; top: -12px; bottom: -14px; } /* bigger finger target */
    body.touch #timebar .knob { width: 20px; height: 20px; top: 4px; }
    body.touch #timebar .date { top: -20px; font-size: 13px; }
    body.touch #hint { bottom: calc(80px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <select id="season" aria-label="season"></select>
  <div id="timebar"><div class="track"></div><div class="fill"></div><div class="knob"></div><div class="date"></div></div>
  <div id="obs"></div>
  <div id="hint"></div>
  <div id="weak"></div>
  <div id="tip" class="card"></div>
  <div id="tip2" class="card"></div>
  <div id="tbtns"><button id="b-weak" type="button">weak layers</button><button id="b-report" type="button" hidden>av report</button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
